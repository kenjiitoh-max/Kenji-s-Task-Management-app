<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>体重管理アプリ</title>

  <!-- Bootstrap 3.3.7 CSS (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.7/css/bootstrap.min.css">

  <style>
    body { background-color: #f5f5f5; padding-top: 70px; }
    .chart-wrap { position: relative; height: 320px; }
    footer { text-align: center; color: #777; font-size: 12px; margin: 30px 0 20px 0; }
  </style>
</head>
<body>

  <nav class="navbar navbar-default navbar-fixed-top">
    <div class="container">
      <div class="navbar-header">
        <a class="navbar-brand" href="#">体重管理アプリ</a>
      </div>
      <div class="pull-right" style="margin-top: 15px;">
        <span id="status-label" class="label label-default">読み込み中...</span>
      </div>
    </div>
  </nav>

  <div class="container">

    <!-- 入力フォーム -->
    <div class="panel panel-default">
      <div class="panel-heading">今日の記録</div>
      <div class="panel-body">
        <form id="weight-form" class="form-inline">
          <div class="form-group">
            <label for="input-weight">体重 (kg)</label>
            <input type="number" step="0.1" min="1" max="500" class="form-control" id="input-weight" required>
          </div>
          <div class="form-group" style="margin-left: 10px;">
            <label for="input-body-fat">体脂肪率 (%)</label>
            <input type="number" step="0.1" min="0" max="100" class="form-control" id="input-body-fat">
          </div>
          <div class="form-group" style="margin-left: 10px;">
            <label for="input-note">メモ</label>
            <input type="text" class="form-control" id="input-note" placeholder="朝の計測 など">
          </div>
          <button type="submit" class="btn btn-primary" style="margin-left: 10px;">記録する</button>
        </form>
      </div>
    </div>

    <!-- グラフ -->
    <div class="panel panel-default">
      <div class="panel-heading">
        推移
        <select id="time-scale-select" class="form-control input-sm pull-right" style="width: auto;">
          <option value="">すべて</option>
          <option value="week">直近7日</option>
          <option value="month">直近30日</option>
          <option value="year">直近1年</option>
        </select>
      </div>
      <div class="panel-body">
        <div class="chart-wrap"><canvas id="weight-chart"></canvas></div>
      </div>
    </div>

    <!-- 一覧 -->
    <div class="panel panel-default">
      <div class="panel-heading">記録一覧</div>
      <table class="table table-striped">
        <thead>
          <tr><th>日時</th><th>体重 (kg)</th><th>体脂肪率 (%)</th><th>メモ</th><th></th></tr>
        </thead>
        <tbody id="entries-body"></tbody>
      </table>
    </div>

    <footer>学習用スターター: このファイルを書き換えながら機能を足していこう</footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
  <!-- Chart.js 2.9.x -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js"></script>

  <script>
    // バックエンドの URL。静的ファイルとして FastAPI から配信される場合は同一オリジン。
    var API_BASE = (location.protocol === 'file:') ? 'http://localhost:8000' : '';

    var chart = null;

    function formatTimestamp(iso) {
      var d = new Date(iso);
      return d.toLocaleString('ja-JP');
    }

    function renderChart(entries) {
      var ctx = document.getElementById('weight-chart').getContext('2d');
      var data = {
        labels: entries.map(function (e) { return formatTimestamp(e.timestamp); }),
        datasets: [{
          label: '体重 (kg)',
          data: entries.map(function (e) { return e.weight_kg; }),
          borderColor: '#337ab7',
          backgroundColor: 'rgba(51, 122, 183, 0.1)',
          fill: true,
          lineTension: 0.2
        }]
      };

      if (chart) {
        chart.data = data;
        chart.update();
        return;
      }

      chart = new Chart(ctx, {
        type: 'line',
        data: data,
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { yAxes: [{ ticks: { beginAtZero: false } }] }
        }
      });
    }

    function renderTable(entries) {
      var $body = $('#entries-body').empty();
      entries.slice().reverse().forEach(function (e) {
        var $row = $('<tr>');
        $row.append($('<td>').text(formatTimestamp(e.timestamp)));
        $row.append($('<td>').text(e.weight_kg));
        $row.append($('<td>').text(e.body_fat_percentage === null ? '-' : e.body_fat_percentage));
        $row.append($('<td>').text(e.note || ''));
        $row.append($('<td>').append(
          $('<button class="btn btn-xs btn-danger">削除</button>').on('click', function () {
            deleteEntry(e.id);
          })
        ));
        $body.append($row);
      });
    }

    function loadEntries() {
      var timeScale = $('#time-scale-select').val();
      var url = API_BASE + '/api/weight' + (timeScale ? '?time_scale=' + timeScale : '');
      $.getJSON(url)
        .done(function (data) {
          $('#status-label').removeClass('label-danger').addClass('label-success')
            .text(data.count + ' 件の記録');
          renderChart(data.entries);
          renderTable(data.entries);
        })
        .fail(function () {
          $('#status-label').removeClass('label-success').addClass('label-danger')
            .text('バックエンドに接続できません');
        });
    }

    function deleteEntry(entryId) {
      $.ajax({ url: API_BASE + '/api/weight/' + entryId, type: 'DELETE' }).done(loadEntries);
    }

    $('#weight-form').on('submit', function (event) {
      event.preventDefault();
      var bodyFat = $('#input-body-fat').val();
      var payload = {
        weight_kg: parseFloat($('#input-weight').val()),
        body_fat_percentage: bodyFat === '' ? null : parseFloat(bodyFat),
        note: $('#input-note').val() || null
      };

      $.ajax({
        url: API_BASE + '/api/weight',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(payload)
      }).done(function () {
        $('#input-weight').val('');
        $('#input-body-fat').val('');
        $('#input-note').val('');
        loadEntries();
      }).fail(function () {
        alert('記録に失敗しました');
      });
    });

    $('#time-scale-select').on('change', loadEntries);

    // 拡張ポイント: 英語学習ログや筋トレログのタブを増やすなら、
    // ここに loadEnglishLogs() などを足して同じ流れで描画する。
    loadEntries();
  </script>
</body>
</html>
