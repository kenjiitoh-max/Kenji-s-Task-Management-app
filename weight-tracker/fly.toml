app = "kenji-weight-tracker"
primary_region = "nrt"

[build]

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  # アクセスがない間はマシンを停める（課金も止まる）。次のアクセスで数秒かけて起き上がる
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[mounts]
  source = "weight_tracker_data"
  destination = "/data"
